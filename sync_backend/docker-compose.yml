services:
  yolo-sync-backend:
    build: .
    container_name: yolo-sync-backend
    expose:
      - "8095"
    environment:
      - SYNC_DB_PATH=/data/sync.db
      - SYNC_BACKUP_DIR=/data/backups
      - SYNC_SESSION_TTL_SECONDS=45
      - SYNC_BACKUP_RETENTION_DAYS=14
      - SYNC_MAX_FILE_BYTES=${SYNC_MAX_FILE_BYTES:-8388608}
      - SYNC_MAX_ZIP_UPLOAD_BYTES=${SYNC_MAX_ZIP_UPLOAD_BYTES:-536870912}
      - SYNC_REQUIRE_PROJECT_PASSWORD=${SYNC_REQUIRE_PROJECT_PASSWORD:-0}
      - SYNC_BOOTSTRAP_TOKEN=${SYNC_BOOTSTRAP_TOKEN:-}
      - SYNC_S3_BUCKET=${SYNC_S3_BUCKET:-}
      - SYNC_S3_PREFIX=${SYNC_S3_PREFIX:-datasets/pokemon}
      - SYNC_S3_REGION=${SYNC_S3_REGION:-}
      - SYNC_SIGNED_URL_TTL_SECONDS=${SYNC_SIGNED_URL_TTL_SECONDS:-180}
      - SYNC_PREFETCH_MAX_BATCH=${SYNC_PREFETCH_MAX_BATCH:-40}
      - SYNC_CLOUDFRONT_BASE_URL=${SYNC_CLOUDFRONT_BASE_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_DEFAULT_REGION=${SYNC_S3_REGION:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - default
      - proxy_net

networks:
  proxy_net:
    external: true
